services:
  - type: web
    name: asd-solutions
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: asd-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
